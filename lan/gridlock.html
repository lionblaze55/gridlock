<!DOCTYPE html>

<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:Rubik,system-ui,sans-serif;color:#fff}

.title{font-family:Bungee,Impact,sans-serif;font-size:clamp(34px,9vw,64px);line-height:.95;color:#f2c230;text-shadow:3px 3px 0 #c0392b,6px 6px 0 #000;letter-spacing:1px;text-align:center}
.sub{font-family:Bungee,sans-serif;text-align:center;color:#7fdbff;margin:6px 0 14px;letter-spacing:3px;font-size:14px}
h2{font-family:Bungee,sans-serif;color:#f2c230;margin:0 0 10px;font-size:20px;letter-spacing:1px}
.btn{display:block;width:100%;box-sizing:border-box;margin:7px 0;padding:12px 14px;font:800 16px Rubik,system-ui,sans-serif;color:#111;background:#f2c230;border:0;border-radius:4px;box-shadow:0 4px 0 #8a6a00;cursor:pointer;text-align:left}

@media (orientation:landscape){#garage .gbox{grid-template-columns:44% 56%;grid-template-rows:auto auto 1fr auto}#garage .gmain{grid-row:2/5}#garage .ghead{grid-column:1/3}#garage .gtabs{grid-column:2}#garage .gopts{grid-column:2}#garage .gfoot{grid-column:2}}

#panel .prow{display:flex;align-items:center;gap:8px;background:#1d222d;border-radius:4px;padding:5px 6px}
#panel .pe{width:44px;text-align:center;font-size:20px;flex:none;line-height:1}#panel .pe canvas{display:block}
#panel .pt{flex:1;min-width:0;display:flex;flex-direction:column}#panel .pt b{font:700 13px Rubik,system-ui,sans-serif;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#panel .pt small{font:500 11px Rubik,system-ui,sans-serif;color:#9aa3b5}
#panel .pbs{display:flex;gap:4px;flex:none}
#panel .pb{padding:8px 9px;font:800 12px Rubik,system-ui,sans-serif;border:0;border-radius:4px;background:#2b3140;color:#fff;box-shadow:0 2px 0 #0b0d11}#panel .pb.y{background:#f2c230;color:#111}#panel .pb.on{background:#2ecc71;color:#08200f}#panel .pb[disabled]{opacity:.4}

#panel .gbar{display:flex;align-items:center;gap:8px;font:600 11px Rubik,system-ui,sans-serif;color:#aab3c5}#panel .gbar span{width:70px;flex:none}#panel .gbar i{flex:1;height:7px;background:#232835;border-radius:4px;overflow:hidden;display:block}#panel .gbar b{display:block;height:100%;background:linear-gradient(90deg,#f2c230,#ff6f3c);border-radius:4px;transition:width .3s}

#panel .gbar i{position:relative}
#panel .prow.sel{outline:2px solid #4fc3f7;background:#11263a}
#panel .pinfo{display:flex;flex-direction:column;gap:5px;background:#1d222d;border-radius:4px;padding:8px;margin-top:4px}#panel .pinfo b{font:800 13px Rubik,system-ui,sans-serif;color:#4fc3f7}#panel .pinfo span{font:500 12px Rubik,system-ui,sans-serif;color:#cfd6e4;line-height:1.35}#panel .pinfo span.fact{color:#9aa3b5}#panel .pinfo .pb{padding:10px}
#panel .pbig{font-size:64px;text-align:center;padding:10px 0}
.sld{display:flex;align-items:center;gap:8px;font:700 12px Rubik,system-ui,sans-serif;color:#cfd6e4;margin:5px 0}.sld span{width:74px;flex:none}.sld input{flex:1;accent-color:#f2c230;height:26px;touch-action:pan-x}.sld b{width:28px;text-align:right;color:#f2c230}
.slot{display:flex;align-items:center;gap:8px;background:#0b0d11;border:2px solid #2b3140;border-radius:4px;padding:7px 9px;margin:5px 0}.slot.cur{border-color:#f2c230}
.slot .sinfo{flex:1;min-width:0;display:flex;flex-direction:column}.slot .sinfo b{font:800 14px Rubik,system-ui,sans-serif}.slot .sinfo span{font:500 12px Rubik,system-ui,sans-serif;color:#9aa3b5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .sbtns{display:flex;gap:5px;flex:none}.slot .btn{width:auto;margin:0;padding:8px 10px;font-size:13px}
.kbd{display:inline-block;background:#2b3140;border-radius:3px;padding:0 5px;font-size:12px;margin:1px}

<body>
<canvas id="c"></canvas>
<div id="menu" class="ov"><div class="box" id="menubox"></div></div>
<div id="garage" class="ov"><div class="gbox"><div class="ghead"><span class="gname">Garage</span><span class="gcash"></span></div><div class="gmain"><canvas id="gprev" width="420" height="220"></canvas><div class="gstats"></div></div><div class="gtabs"></div><div class="gopts"></div><div class="gfoot"></div></div></div>
<div id="panel" class="ov"><div class="pbox"><div class="phead"><span class="pname"></span><span class="pcash"></span><button class="px" onclick="Panel.close()">✕</button></div><div class="ptabs"></div><div class="pbody"></div><div class="pfoot"></div></div></div>

<script>
'use strict';
// ================= CORE UTILITIES =================
const T = 64;               // world units per tile
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist2 = (ax, ay, bx, by) => { const dx = ax - bx, dy = ay - by; return dx * dx + dy * dy; };
const dist = (ax, ay, bx, by) => Math.sqrt(dist2(ax, ay, bx, by));
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);
const rint = (a, b) => Math.floor(rnd(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const chance = p => Math.random() < p;
const now = () => performance.now() / 1000;
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function shade(hex, f) { // f<1 darker, >1 lighter
  const n = parseInt(hex.slice(1), 16); let r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  if (f < 1) { r *= f; g *= f; b *= f; } else { r += (255 - r) * (f - 1); g += (255 - g) * (f - 1); b += (255 - b) * (f - 1); }
  return '#' + ((1 << 24) | (clamp(r | 0, 0, 255) << 16) | (clamp(g | 0, 0, 255) << 8) | clamp(b | 0, 0, 255)).toString(16).slice(1);
}
function money(n) { return '$' + Math.floor(n).toLocaleString('en-US'); }
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

// ================= DEFINITIONS =================
const WEAPONS = [
  { id: 'fist', name: 'Fists', rate: 2.6, dmg: 12, range: 30, melee: 1, sound: 'punch' },
  { id: 'pistol', name: 'Pistol', mag: 12, reload: 1, rate: 3.4, dmg: 22, spread: .03, range: 640, ammo0: 40, price: 250, ammoPrice: 60, sound: 'pistol' },
  { id: 'uzi', name: 'Machine Pistol', mag: 30, reload: 1.3, rate: 11, dmg: 11, spread: .09, range: 560, ammo0: 150, price: 700, ammoPrice: 120, sound: 'uzi' },
  { id: 'shotgun', name: 'Shotgun', mag: 6, reload: 1.7, rate: 1.15, dmg: 14, pellets: 7, spread: .24, range: 380, ammo0: 24, price: 1100, ammoPrice: 150, sound: 'shotgun' },
  { id: 'molotov', name: 'Molotov', rate: 1.3, proj: 'molotov', ammo0: 8, price: 450, ammoPrice: 200, sound: 'throw' },
  { id: 'rocket', name: 'Rocket Launcher', rate: .8, proj: 'rocket', ammo0: 6, price: 3500, ammoPrice: 900, sound: 'rocket' },
  { id: 'rifle', name: 'Assault Rifle', mag: 30, reload: 1.5, rate: 8, dmg: 19, spread: .05, range: 720, ammo0: 90, price: 2400, ammoPrice: 220, sound: 'rifle' },
];
const WI = {}; WEAPONS.forEach((w, i) => WI[w.id] = i);

const CAR_TYPES = {
  compact: { name: 'Pipsqueak', L: 30, W: 16, max: 470, acc: 380, steer: 3.0, grip: 9, hp: 90, mass: .8, cols: ['#e74c3c', '#3498db', '#f1c40f', '#ecf0f1', '#8e44ad', '#16a085', '#d35400'] },
  sedan: { name: 'Stallion', L: 34, W: 17, max: 530, acc: 360, steer: 2.7, grip: 8.5, hp: 110, mass: 1, cols: ['#2c3e50', '#7f8c8d', '#c0392b', '#27ae60', '#bdc3c7', '#2980b9', '#6d4c41', '#34495e'] },
  sports: { name: 'Cheetah GT', L: 34, W: 16, max: 760, acc: 600, steer: 3.1, grip: 10, hp: 85, mass: .9, cols: ['#e74c3c', '#f39c12', '#f1c40f', '#111111', '#ffffff', '#2ecc71'] },
  muscle: { name: 'Boxer', L: 36, W: 18, max: 660, acc: 520, steer: 2.6, grip: 6.5, hp: 120, mass: 1.15, cols: ['#c0392b', '#111111', '#2980b9', '#f39c12', '#8e44ad'] },
  taxi: { name: 'Cabbie', L: 34, W: 17, max: 520, acc: 360, steer: 2.7, grip: 8.5, hp: 110, mass: 1, cols: ['#f5c400'] },
  cop: { name: 'Interceptor', L: 35, W: 17, max: 660, acc: 520, steer: 2.9, grip: 9, hp: 150, mass: 1.1, cols: ['#f4f4f4'] },
  van: { name: 'Hauler', L: 40, W: 19, max: 420, acc: 260, steer: 2.3, grip: 8, hp: 160, mass: 1.6, cols: ['#ecf0f1', '#95a5a6', '#2c3e50', '#16a085', '#a04000'] },
  swat: { name: 'Enforcer', L: 42, W: 20, max: 520, acc: 360, steer: 2.3, grip: 8, hp: 320, mass: 2.4, cols: ['#1b2631'] },
  truck: { name: 'Big Haul', L: 52, W: 20, max: 380, acc: 210, steer: 1.9, grip: 8, hp: 240, mass: 2.6, cols: ['#c0392b', '#2471a3', '#1e8449', '#7d6608'] },
  pickup: { name: 'Rancher', L: 36, W: 18, max: 500, acc: 340, steer: 2.5, grip: 7.5, hp: 130, mass: 1.3, cols: ['#7b241c', '#1a5276', '#145a32', '#b9770e', '#566573'] },
};
CAR_TYPES.tractor = { name: 'Plowboy', custom: 1, L: 28, W: 18, max: 230, acc: 200, steer: 2.4, grip: 9, hp: 180, mass: 1.8, cols: ['#2e7d32', '#c62828', '#1565c0'] };
CAR_TYPES.bike = { name: 'Hellhound', custom: 1, L: 22, W: 9, max: 780, acc: 680, steer: 3.3, grip: 9.5, hp: 55, mass: .45, cols: ['#111111', '#7b1e1e', '#37474f', '#d4af37'] };
const RTRAFFIC = ['pickup', 'pickup', 'pickup', 'truck', 'sedan', 'van', 'tractor', 'muscle', 'compact'];
const TRAFFIC_MIX = ['compact', 'compact', 'sedan', 'sedan', 'sedan', 'sports', 'muscle', 'taxi', 'taxi', 'van', 'truck', 'pickup', 'pickup'];

// weapon icon drawing (x,y = center, s = scale)
function drawWeaponIcon(g, id, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col || '#fff'; g.strokeStyle = col || '#fff'; g.lineWidth = 1.5;
  switch (id) {
    case 'fist': g.beginPath(); g.arc(0, 0, 6, 0, TAU); g.fill(); g.fillStyle = 'rgba(0,0,0,.4)'; for (let i = -1; i < 2; i++) g.fillRect(i * 3 - 1, -6, 1, 5); break;
    case 'pistol': g.fillRect(-8, -4, 14, 4); g.fillRect(-7, 0, 4, 7); break;
    case 'uzi': g.fillRect(-9, -4, 17, 4); g.fillRect(-4, 0, 4, 8); g.fillRect(2, 0, 2, 5); break;
    case 'shotgun': g.fillRect(-11, -3, 22, 3); g.fillRect(-11, 0, 7, 4); g.fillRect(0, 0, 5, 2); break;
    case 'molotov': g.fillRect(-3, -2, 6, 9); g.fillRect(-1.5, -6, 3, 4); g.fillStyle = '#ff8c1a'; g.beginPath(); g.moveTo(0, -12); g.lineTo(3, -6); g.lineTo(-3, -6); g.fill(); break;
    case 'rifle': g.fillRect(-12, -3, 24, 3); g.fillRect(-12, 0, 6, 4); g.fillRect(-2, 0, 3, 7); g.fillRect(4, 0, 2, 3); break;
    case 'rocket': g.fillRect(-11, -3, 20, 5); g.fillRect(-4, 2, 3, 5); g.beginPath(); g.moveTo(9, -4); g.lineTo(13, -.5); g.lineTo(9, 3); g.fill(); break;
    case 'health': g.fillStyle = '#e74c3c'; g.fillRect(-7, -2.5, 14, 5); g.fillRect(-2.5, -7, 5, 14); break;
    case 'armor': g.fillStyle = '#5dade2'; g.beginPath(); g.moveTo(0, -8); g.lineTo(7, -5); g.lineTo(6, 3); g.lineTo(0, 8); g.lineTo(-6, 3); g.lineTo(-7, -5); g.fill(); break;
    case 'cash': g.fillStyle = '#2ecc71'; g.fillRect(-8, -5, 16, 10); g.fillStyle = '#145a32'; g.font = 'bold 9px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('$', 0, 1); break;

// ================= AUDIO ENGINE =================
const Snd = {
  ctx: null, master: null, sfx: null, mus: null, amb: null, noise: null, brown: null, vol: store.get('gl_vol', .8), mvol: store.get('gl_mvol', .5), avol: store.get('gl_avol', .7),
  listener: { x: 0, y: 0 }, L: {}, timers: {}, lastVoice: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      const c = this.ctx = new AC();
      const comp = c.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4; comp.connect(c.destination);
      this.master = c.createGain(); this.master.connect(comp);
      this.sfx = c.createGain(); this.sfx.gain.value = this.vol; this.sfx.connect(this.master);
      this.mus = c.createGain(); this.mus.gain.value = this.mvol * .5; this.mus.connect(this.master);
      this.amb = c.createGain(); this.amb.gain.value = this.avol * this.vol; this.amb.connect(this.master);
      // noise buffers
      const len = c.sampleRate * 2, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; this.noise = b;
      const bb = c.createBuffer(1, len, c.sampleRate), bd = bb.getChannelData(0); let last = 0;
      for (let i = 0; i < len; i++) { last = (last + .02 * (Math.random() * 2 - 1)) / 1.02; bd[i] = last * 3.5; } this.brown = bb;
      // echo (outdoors) + reverb (indoors)
      const dl = c.createDelay(1); dl.delayTime.value = .21; const fb = c.createGain(); fb.gain.value = .3; const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      this.echoSend = c.createGain(); this.echoSend.gain.value = .2; this.sfx.connect(this.echoSend); this.echoSend.connect(dl); dl.connect(lp); lp.connect(fb); fb.connect(dl); lp.connect(this.master);

async function doJoin(code) {
  code = String(code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

  menuBox.querySelectorAll('button').forEach(b => b.disabled = true);
  const ok = await Net.join(code);
  if (!ok) { Snd.play('bad'); mpMenu(); menuBox.append(h('div', { class: 'small', style: 'color:#ff6b6b', text: 'Couldn\'t join that room. Try again in a moment.' })); return; }

}

function howTo() {

<b>Touch</b><br>• Left side: drag anywhere to move. Push all the way to run.<br>• <b>Fire</b> (big red button): tap to shoot where you face, or drag it to aim. Aim assist locks onto nearby targets.<br>• <b>USE</b> pops up near people, doors and objects — talk, shop, enter buildings, rob registers, read papers, play arcades…<br>• <b>GET IN</b> appears near cars. Jack anything, even with someone inside.<br>• In a car: push the stick toward where you want to go. <b>DRIFT</b> = handbrake, <b>BRAKE</b> = brake/reverse. Fire shoots forward.<br><br>
<b>Keyboard</b><br><span class="kbd">WASD</span> move/drive · <span class="kbd">Mouse</span> aim · <span class="kbd">Click</span>/<span class="kbd">J</span> shoot · <span class="kbd">F</span> car · <span class="kbd">E</span> use · <span class="kbd">Space</span> handbrake · <span class="kbd">Shift</span> run · <span class="kbd">Q</span> weapon · <span class="kbd">R</span> radio · <span class="kbd">H</span> horn/siren · <span class="kbd">N</span> nitrous · <span class="kbd">I</span> backpack · <span class="kbd">V</span> reload · <span class="kbd">M</span> map · <span class="kbd">T</span> chat · <span class="kbd">1-9</span> pick dialog option<br><br>
<b>The city</b><br>• Ringing <b>payphones</b> offer jobs: deliveries, car thefts, hits, taxi fares, demolition. Gang members offer turf-war work.<br>• Crimes earn <b>wanted stars</b>. Break line of sight, hide indoors, use a <b>Respray</b> garage, bribe a cop, or pay the fine at a police station.<br>• Cash in your pocket is lost when you're wasted or busted. Use an <b>ATM</b> or bank teller.<br>• Sleep in <b>Your Apartment</b> to save and heal. The stash there restocks armor.<br>• Every door is enterable: shops, diners, bars, a nightclub, strip clubs, offices, homes, warehouses, a bank (with a vault…).<br>• <b>Customs garages</b> (wrench icon): drive in to paint, add liveries, rims, spoilers, neon, and tune engine, turbo, nitrous, brakes, suspension and armor. Your modded car is saved as your ride.<br>• <b>Chop shops</b> (orange): sell stolen cars. Cars on the daily wanted list pay double.<br>• <b>Backpack</b> (bag button, top left): everything you find goes here — use food and medkits, drop things, or sell loot at <b>pawn shops</b>. Your <b>home stash</b> holds 5,000 units and every car has a <b>trunk</b> (stand behind it and tap USE).<br>• <b>Gun shops</b> have a workbench: suppressors, mags, sights, ammo types and finishes. Guns now have magazines and reload.<br>• <b>Out of town</b>: drive west or south for farms, forests, lakes (fishing!), a quarry, the beach, Dusty Creek and the Road Reapers' trailer park. Five gangs each hold turf; work for them or cross them and your standing changes.<br>• <b>Street dealers</b> (green dots): buy low, sell high. Prices differ by district and change daily. Cops may search you, and you lose your product if busted or wasted.<br><br>
<b>Multiplayer</b><br>Online: create a room and share the 4-letter code. <b>LAN</b> (Android app or the downloaded file): one phone hosts, and friends on the same Wi-Fi join by its address — or just open that address in a browser. Everyone shares the city; traffic and pedestrians are local to each player. Tap the room label to see the scoreboard.` }));

  G.cars = []; G.peds = []; G.projs = []; G.fires = []; G.drops = []; G.fx = []; G.scene = null; G.interiors = {};
  const sp = spawnPoint(); G.player = newPlayer(sp.x, sp.y); G.player.a = Math.PI / 2;
  G.mode = 'play'; G.inGame = true; G.snapCam = 1; G.fade = 1.5; G.godT = 2; G.spawnT = 0; G.district = null;
  hideMenu(); Snd.init();
  // a starter car nearby
  const near = randStreetPoint(60, 260, TILE.ROAD); const ride = G.save.ride && CAR_TYPES[G.save.ride.type] ? G.save.ride : null;
  const sc = new Car(ride ? ride.type : 'compact', near.x, near.y, 0, '#3498db'); if (ride) { applyMods(sc, Object.assign({}, ride.mods)); sc.isRide = 1; sc.persist = 1; sc.owned = 1; } sc.ai = { mode: 'parked' }; G.cars.push(sc);
  loadInv(); if (ride) sc.trunk = ride.trunk || {}; newDay(); G.tod = 15.5; G.weather = { rain: 0, target: 0, t: 160 };
  if (ride) setTimeout(() => msg('Your custom ride is parked nearby.', '#2ecc71'), 1200);

  if (!store.get('gl_seenhelp', 0)) { store.set('gl_seenhelp', 1); setTimeout(() => msg('Tip: walk up to people, doors and objects and tap USE.', '#7fdbff'), 2500); }
}
function attract(dt) {
  // menu background: drift along a road with live traffic
  const p = G.player; if (!p) return; G.godT = 99;
  G.attractA = (G.attractA || 0) + dt * .05; G.tod = 19.2 + Math.sin(G.t * .05) * .4;
  p.x += 70 * dt; if (p.x > (N - 6) * T) p.x = 6 * T; p.y = roadCY(4) + Math.sin(G.attractA) * 10;
  G.cam.z = Math.min(VW, VH) / (9 * T); G.cam.x = p.x; G.cam.y = p.y;
  spawnCity(dt); for (const c of G.cars) { if (c.ai) updateCarAI(c, dt); updateCar(c, dt); }
  for (let i = 0; i < G.cars.length; i++) for (let j = i + 1; j < G.cars.length; j++) carCarCollide(G.cars[i], G.cars[j]);
  for (const q of G.peds) { if (!q.dead) updatePedAI(q, dt); updatePedMove(q, dt); }
  updateFx(dt);
}
let lastT = performance.now();

  let dt = Math.min(.05, (t - lastT) / 1000); lastT = t; const rdt = dt;

  try {
    pollKeys();
    if (G.mode === 'menu') { attract(dt); Net.update(dt); }

    G.player.hidden = G.mode === 'menu'; if (G.mode === 'menu') { Snd.listener.x = G.cam.x; Snd.listener.y = G.cam.y; } Snd.update(rdt);

}
